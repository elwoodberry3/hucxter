name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Lint, typecheck, unit and e2e
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

      # Desktop + mobile Chromium (Pixel 7) and mobile WebKit (iPhone 15) projects (ADR-0011).
      - name: Install Playwright browsers
        run: pnpm --filter @hucxter/web exec playwright install --with-deps chromium webkit

      # The storefront reads categories and postal areas from local Supabase (never a remote
      # project). Database, REST, Auth, and Mailpit (e2e reads 6-digit email codes from its API).
      - uses: supabase/setup-cli@v3
        with:
          version: 2.122.0

      # Storage stays on for profile photos (Brief 03C.2).
      - name: Start local Supabase (database, REST, Auth, Storage, Mailpit)
        run: supabase start -x realtime,imgproxy,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - run: supabase db reset

      - run: pnpm test:e2e

      # sharp#4567: the avatar route's build trace must carry sharp and libvips for linux-x64.
      - name: Check the sharp build trace
        run: node apps/web/scripts/check-sharp-trace.mjs

      - name: Upload Playwright report and screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-${{ github.run_id }}
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 14

  db:
    name: Database (local Supabase + pgTAP)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: supabase/setup-cli@v3
        with:
          version: 2.122.0

      # Local stack only (never linked to a remote project). Auth (gotrue) runs too: it creates
      # auth.sessions, which the account functions and their pgTAP tests use.
      # Storage runs so the avatars bucket migration applies to a real storage schema.
      - name: Start local Supabase (Postgres + Auth + Storage)
        run: supabase start -x realtime,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - run: supabase db reset
      - run: supabase test db
